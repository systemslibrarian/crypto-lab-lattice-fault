name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # The gate, called rather than copied -- the same file the Dependabot
  # auto-merge waits on, so what merges a bump and what publishes it are
  # one definition and cannot drift apart.
  gate:
    uses: ./.github/workflows/gate.yml

  build:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # 24, not 20 -- must match ci.yml, which explains why. jsdom 30 pulls
          # undici 8, which calls worker_threads.markAsUncloneable; that landed
          # in Node 22.10 and was never backported to 20, so on 20.x the
          # jsdom-environment test file below cannot load and `npm test` exits 1
          # having silently skipped it.
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: [gate, build]
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
